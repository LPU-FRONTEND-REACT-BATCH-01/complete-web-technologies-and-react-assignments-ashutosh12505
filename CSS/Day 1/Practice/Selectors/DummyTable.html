<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Selectors</title>
    <style>
        body{
            padding: 20px;
        }
        td{
            width: 200px;
            border-radius: 10px;
        }
        table tr:nth-of-type(2n){
            background-color: cadetblue;
        }
        table tr:nth-of-type(2n):hover{
            background-color: rgb(50, 85, 87);
        }
        table tr:nth-of-type(2n+1){
            background-color:silver;
        }
        table tr:nth-of-type(2n+1):hover{
            background-color:rgb(115, 115, 115);
        }
    </style>
</head>
<body>
    <h2>Dummy Table</h2>
    <table border="1" cellpadding="20">
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
        <tr><td></td><td></td></tr>
    </table>
</body>
</html>
