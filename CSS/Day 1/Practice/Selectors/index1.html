<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <link rel="stylesheet" href="./style1.css">
</head>
<body>
    <h3>For a single element, only one id is allowed. But multiple classes can be applied by giving space between them.</h3>
    <ul>
        <h4 id="list-heading">List items</h4>
        <li class="list-item">First Item</li>
        <li class="list-item">Second Item</li>
        <li class="list-item third-item">Third Item</li>
        <li class="list-item">Fourth Item</li>
        <li class="list-item">Fifth Item</li>
    </ul>
</body>
</html>
