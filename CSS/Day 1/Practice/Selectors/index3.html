<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <link rel="stylesheet" href="./style3.css">
</head>
<body>
    <ul class="fruits">
        <h3>Fruits</h3>
        <li>Apple</li>
        <li>Mango
            <div>
                <ul>
                    <li>Small</li>
                    <li>Medium</li>
                    <li>Big</li>
                </ul>
            </div>
        </li>
        <li>Banana</li>
        <div>
            <ul>
                <li>Small</li>
                <li>Medium</li>
                <li>Big</li>
            </ul>
        </div>
    </ul>
    <ul class="colors">
        <h3>Colors</h3>
        <li>Red</li>
        <li>Orange
            <div>
                <ul>
                    <li>Light</li>
                    <li>Medium</li>
                    <li>Deep</li>
                </ul>
            </div>
        </li>
        <li>Yellow</li>
        <div>
            <!-- not a li element in colors class -->
            <ul>
                <li>Light</li>
                <li>Medium</li>
                <li>Deep</li>
            </ul>
        </div>
    </ul>
</body>
</html>
