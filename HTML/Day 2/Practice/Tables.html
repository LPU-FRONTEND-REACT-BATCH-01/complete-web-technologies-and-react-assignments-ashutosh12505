<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body style="padding: 20px;">
    <h2>Colspan and Rowspan practice</h2>
    <table border="1px" cellpadding="10px">
        <tr>
            <td>Quick</td>
            <td colspan="2">Brown Fox</td>
            <td>Jumps</td>
        </tr>
        <tr>
            <td rowspan="3">Over the</td>
            <td>lazy</td>
            <td>dog</td>
            <td>and</td>
        </tr>
        <tr>
            <td>then</td>
            <td>it</td>
            <td>fall</td>
        </tr>
        <tr>
            <td colspan="3">prey to a lion</td>
        </tr>
    </table>
</body>
</html>
