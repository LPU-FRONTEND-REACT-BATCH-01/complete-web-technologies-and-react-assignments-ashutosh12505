<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List Task</title>
    <style>
        body{
            padding: 20px;
        }
        table{
            border: 1px solid;
            text-align: center;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h2>Grocery List</h2>
    <table border="1px" cellpadding="10px" cellspacing="0px">
        <thead>
            <tr>
                <th>S No.</th>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>Sugar</td>
                <td>50</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Cookies</td>
                <td>70</td>
            </tr>
            <tr>
                <td>3</td>
                <td>Wheat</td>
                <td>120</td>
            </tr>
            <tr>
                <td>4</td>
                <td>Rice</td>
                <td>60</td>
            </tr>
            <tr>
                <td>5</td>
                <td>Biscuits</td>
                <td>50</td>
            </tr>
            <tr>
                <td>6</td>
                <td>Salt</td>
                <td>20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
